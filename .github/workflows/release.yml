name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag (z.B. v1.1.0); wird angelegt, falls er fehlt"
        required: true
        default: "v1.1.0"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Exe bauen
        run: pyinstaller --noconfirm --noconsole --name BlinkGuard --collect-all mediapipe --add-data "blinkguard/assets;blinkguard/assets" blinkguard/__main__.py

      - name: ZIP packen
        run: Compress-Archive -Path dist/BlinkGuard -DestinationPath BlinkGuard-windows.zip

      - name: Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: BlinkGuard-windows
          path: BlinkGuard-windows.zip

      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: BlinkGuard ${{ inputs.tag || github.ref_name }}
          files: BlinkGuard-windows.zip
          body: |
            Fertig gebaute Windows-App – kein Python nötig.

            **Installation:** `BlinkGuard-windows.zip` herunterladen, entpacken,
            `BlinkGuard.exe` starten. Beim ersten Start lädt die App einmalig das
            Erkennungsmodell (~4 MB) und Windows fragt nach der Kamera-Berechtigung.
            Das Augen-Icon erscheint im Infobereich unten rechts.
